# Crypto Pier lab: fetch BTC/ETH history from Coinbase's public API, run the
# lab's tests and the backtest suite, and save results to the "data" branch
# under backtests/crypto/. Runs weekly, on lab code changes, and on demand.
# No secrets: it uses the built-in GITHUB_TOKEN, limited to this repo.
name: crypto-lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 6"   # Saturdays 09:17 UTC (2:17 AM Pacific)
  push:
    branches: [main, "lab/**"]
    paths: ["lab/**", ".github/workflows/crypto-lab.yml"]

permissions:
  contents: write

concurrency:
  group: crypto-lab
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lab dependencies
        run: pip install -r lab/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s lab/tests -t . -v

      - name: Restore candle cache
        uses: actions/cache@v4
        with:
          path: backtests/data/crypto
          key: crypto-candles-${{ github.run_id }}
          restore-keys: crypto-candles-

      - name: Run backtests (real Coinbase data)
        run: python -m lab.crypto.run --out out/crypto --cache backtests/data/crypto

      - name: Show report
        run: cat out/crypto/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save results to the data branch
        env:
          SRC_REF: ${{ github.ref_name }}
        run: |
          set -e
          stamp=$(date -u +%Y-%m-%d)
          git config user.name "compound-city-lab"
          git config user.email "lab@users.noreply.github.com"
          git fetch origin data --depth=1 || true
          if git rev-parse --verify -q origin/data >/dev/null; then
            git worktree add -B data ../databranch origin/data
          else
            git worktree add --orphan -b data ../databranch
          fi
          for dest in latest "$stamp"; do
            mkdir -p "../databranch/backtests/crypto/$dest"
            cp out/crypto/* "../databranch/backtests/crypto/$dest/"
          done
          cd ../databranch
          git add backtests/crypto
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "crypto-lab: backtest results $stamp (from $SRC_REF)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:data; then exit 0; fi
            git fetch origin data --depth=1 && git rebase origin/data || true
            sleep $((i * 5))
          done
          exit 1

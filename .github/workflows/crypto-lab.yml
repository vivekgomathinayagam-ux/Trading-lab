# Crypto Pier lab: fetch BTC/ETH history from Coinbase's public API, run the
# lab's tests and the backtest suite, and save results to the "data" branch
# under backtests/crypto/. Runs weekly, on lab code changes, and on demand.
# No secrets: it uses the built-in GITHUB_TOKEN, limited to this repo.
name: crypto-lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 6"   # Saturdays 09:17 UTC (2:17 AM Pacific)
  push:
    branches: [main, "lab/**"]
    paths: ["lab/crypto/**", "lab/tests/test_crypto_lab.py", "lab/requirements.txt", ".github/workflows/crypto-lab.yml"]

permissions:
  contents: write

concurrency:
  group: data-branch-writer
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lab dependencies
        run: pip install -r lab/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s lab/tests -t . -v

      - name: Restore candle cache
        uses: actions/cache@v4
        with:
          path: backtests/data/crypto
          key: crypto-candles-${{ github.run_id }}
          restore-keys: crypto-candles-

      - name: Run backtests (real Coinbase data)
        run: python -m lab.crypto.run --out out/crypto --cache backtests/data/crypto

      - name: Show report
        run: cat out/crypto/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save results to the data branch
        run: |
          stamp=$(date -u +%Y-%m-%d)
          bash scripts/save_to_data_branch.sh "crypto-lab: backtest results $stamp (from ${{ github.ref_name }})" \
            out/crypto:backtests/crypto/latest out/crypto:backtests/crypto/$stamp

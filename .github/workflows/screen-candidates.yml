# One-off ticker screen: price, dollar volume, measured spread (research only; prints a table).
name: screen-candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m lab.news.screen_candidates

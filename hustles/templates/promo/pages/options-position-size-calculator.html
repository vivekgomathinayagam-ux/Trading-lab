<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Options Position Size Calculator (max loss and contracts)</title>
<meta name="description" content="Free options position size calculator: enter account size, risk percent and the trade's max loss per contract to get the number of contracts. Arithmetic only, not advice.">
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;color:#1b1f24}label{display:block;margin:12px 0 4px;font-weight:600}input,select{width:100%;padding:8px;font-size:16px;box-sizing:border-box}#out{margin-top:16px;padding:12px;background:#eef3f8;border-radius:8px}small{color:#555}a{color:#0a58ca}</style></head><body>
<h1>Options position size calculator</h1>
<p><small>Arithmetic only. Not advice or a signal. Options trading involves risk of loss.</small></p>
<label>Account size ($)<input id="acct" type="number" value="2000" min="0"></label>
<label>Risk per trade (%)<input id="pct" type="number" value="5" min="0" step="0.1"></label>
<label>Structure<select id="kind"><option value="long">Long call/put (enter premium)</option><option value="debit">Debit vertical (enter net debit)</option><option value="credit">Credit vertical (enter credit; needs width)</option></select></label>
<label>Premium / debit / credit (per share, e.g. 0.45)<input id="prem" type="number" value="0.45" min="0" step="0.01"></label>
<label>Strike width (credit verticals, e.g. 1)<input id="w" type="number" value="1" min="0" step="0.5"></label>
<label>Fees per contract ($, round trip)<input id="fee" type="number" value="1.30" min="0" step="0.05"></label>
<div id="out"></div>
<p>Want a journal and a full calculator in one file? <a href="https://vivekgo8.gumroad.com/l/aobhdm">Options Day Trader Toolkit ($12)</a>. Built with AI assistance (Claude).</p>
<script>
function calc(a){var risk=a.acct*a.pct/100,per;
 if(a.kind==="credit")per=(a.w-a.prem)*100;else per=a.prem*100;
 per+=a.fee;var n=per>0?Math.floor(risk/per):0;
 return{risk:risk,per:per,n:n};}
function run(){var g=function(i){return parseFloat(document.getElementById(i).value)||0};
 var r=calc({acct:g("acct"),pct:g("pct"),kind:document.getElementById("kind").value,prem:g("prem"),w:g("w"),fee:g("fee")});
 document.getElementById("out").innerHTML="Dollar risk allowed: <b>$"+r.risk.toFixed(2)+"</b><br>Max loss per contract (with fees): <b>$"+r.per.toFixed(2)+"</b><br>Contracts that fit: <b>"+r.n+"</b>"+(r.n===0?"<br><em>Too big for your rule. Skip it or pick a cheaper structure.</em>":"");}
document.querySelectorAll("input,select").forEach(function(e){e.addEventListener("input",run)});run();
if(typeof module!=="undefined")module.exports={calc:calc};
</script></body></html>
